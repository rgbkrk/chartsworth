[tool.poetry]
name = "chartsworth"
version = "0.12.0"
description = ""
authors = ["Kyle Kelley <rgbkrk@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
slack-sdk = "^3.41.0"
numpy = ">=1.23"
matplotlib = ">=3.6"
pillow = ">=10.0"


[tool.poetry.group.dev.dependencies]
mypy = "^1.19.1"
black = "^26.3.1"
types-pillow = "^10.2.0.20240822"
ipykernel = "^7.2.0"
ipython = "^8.38.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
